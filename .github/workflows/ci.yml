name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/miniapp/package-lock.json
      - name: Mini App
        working-directory: web/miniapp
        run: npm ci && npm run check && npm run build
      - name: Tests
        run: dotnet test home-server.slnx
      - name: Release build
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/publish.sh
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
